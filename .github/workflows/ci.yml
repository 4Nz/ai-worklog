name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Skill validator
        run: python -m pip install skills-ref==0.1.1
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s skills/ai-worklog/tests -v
      - name: Validate release metadata
        run: python scripts/validate_release.py
      - name: Validate Agent Skill
        run: agentskills validate skills/ai-worklog
      - name: Build release archive
        run: python scripts/package_release.py --output-dir dist

  macos:
    name: macOS plugin validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validators
        run: |
          python -m pip install skills-ref==0.1.1
          npm install --global @anthropic-ai/claude-code@2.1.250
      - name: Run full tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s skills/ai-worklog/tests -v
      - name: Validate release and Skill
        run: |
          python scripts/validate_release.py
          agentskills validate skills/ai-worklog
      - name: Validate Claude plugin and marketplace
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate . --strict
      - name: Build release archive
        run: python scripts/package_release.py --output-dir dist
